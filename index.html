<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Career Execution Agent</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;font-family:Arial,sans-serif;background:linear-gradient(135deg,#e0eaff,#f5e8ff)}
.card{background:white;width:100%;max-width:420px;padding:28px;border-radius:18px;box-shadow:0 10px 35px #24304b20}
h1{text-align:center;font-size:24px;color:#293b72}
p{text-align:center;color:#626b7b;line-height:1.5}
.tabs{display:flex;gap:5px;margin:22px 0}
button{border:0;border-radius:8px;padding:12px;cursor:pointer;font-size:14px}
.tabs button{flex:1;background:#eef1f8;color:#34405a}
.tabs button.active{background:#dce4ff;font-weight:bold}
label{display:block;margin:14px 0 6px;font-weight:bold}
input{width:100%;padding:12px;border:1px solid #ccd2df;border-radius:8px;font-size:16px}
.primary{width:100%;background:#405de6;color:white;margin-top:18px}
.hidden{display:none!important}
.message{font-size:14px;overflow-wrap:anywhere}
</style>
</head>
<body>
<main class="card">
<h1>🎯 AI Career Execution Agent</h1>
<p>Sign in to build your personalized career roadmap.</p>

<div class="tabs" id="tabs">
<button type="button" class="active" data-page="login">Login</button>
<button type="button" data-page="register">Register</button>
<button type="button" data-page="forgot">Forgot Password</button>
</div>

<section id="login">
<form id="loginForm">
<label>Email address</label>
<input id="loginEmail" type="email" autocomplete="email" required>
<label>Password</label>
<input id="loginPassword" type="password" autocomplete="current-password" required>
<button class="primary" type="submit">Login</button>
</form>
</section>

<section id="register" class="hidden">
<form id="registerForm">
<label>Email address</label>
<input id="regEmail" type="email" autocomplete="email" required>
<label>Create password (at least 6 characters)</label>
<input id="regPassword" type="password" minlength="6" autocomplete="new-password" required>
<button class="primary" type="submit">Create account</button>
</form>
</section>

<section id="forgot" class="hidden">
<form id="forgotForm">
<label>Registered email</label>
<input id="forgotEmail" type="email" autocomplete="email" required>
<button class="primary" type="submit">Send Reset Link</button>
</form>
</section>

<section id="reset" class="hidden">
<form id="resetForm">
<label>New password</label>
<input id="newPassword" type="password" minlength="6" required>
<label>Confirm new password</label>
<input id="confirmPassword" type="password" minlength="6" required>
<button class="primary" type="submit">Save New Password</button>
</form>
</section>

<p id="message" class="message" role="status"></p>
</main>

<script>
(() => {
  const SUPABASE_URL = "https://qokwutbjzcouppalffqk.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_OgBSJx6av6Ba0sYPEY1jag_3PfCODN1";

  const msg = document.getElementById("message");
  const tabs = document.getElementById("tabs");
  let client = null;
  let recoveryMode = false;

  function showMessage(text, error = false) {
    msg.textContent = text;
    msg.style.color = error ? "#b42318" : "#187344";
  }

  function showPage(page) {
    ["login", "register", "forgot", "reset"].forEach(id => {
      document.getElementById(id).classList.toggle("hidden", id !== page);
    });
    tabs.classList.toggle("hidden", page === "reset");
    document.querySelectorAll("[data-page]").forEach(button => {
      button.classList.toggle("active", button.dataset.page === page);
    });
    showMessage("");
  }

  // Tab switching works independently of Supabase.
  tabs.addEventListener("click", event => {
    const button = event.target.closest("button[data-page]");
    if (button) showPage(button.dataset.page);
  });

  try {
    if (!window.supabase) throw new Error("Supabase library did not load.");
    client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  } catch (error) {
    showMessage(error.message, true);
  }

  document.getElementById("loginForm").addEventListener("submit", async event => {
    event.preventDefault();
    if (!client) return showMessage("Connection is not ready. Refresh and try again.", true);

    const email = document.getElementById("loginEmail").value.trim();
    const password = document.getElementById("loginPassword").value;
    const { error } = await client.auth.signInWithPassword({ email, password });

    showMessage(error ? "Login failed: " + error.message :
      "Login successful! Authentication is complete. Dashboard integration is still needed.", !!error);
  });

  document.getElementById("registerForm").addEventListener("submit", async event => {
    event.preventDefault();
    if (!client) return showMessage("Connection is not ready. Refresh and try again.", true);

    const email = document.getElementById("regEmail").value.trim();
    const password = document.getElementById("regPassword").value;
    const { data, error } = await client.auth.signUp({
      email, password,
      options: { emailRedirectTo: window.location.origin + window.location.pathname }
    });

    if (error) showMessage("Registration failed: " + error.message, true);
    else if (!data.session) showMessage("Check your email for the account confirmation link.");
    else showMessage("Account created successfully!");
  });

  document.getElementById("forgotForm").addEventListener("submit", async event => {
    event.preventDefault();
    if (!client) return showMessage("Connection is not ready. Refresh and try again.", true);

    const email = document.getElementById("forgotEmail").value.trim();
    const redirectTo = window.location.origin + window.location.pathname;
    const { error } = await client.auth.resetPasswordForEmail(email, { redirectTo });

    showMessage(error ? "Could not send reset email: " + error.message :
      "If the account exists, a reset email will be sent. Open it on this website.", !!error);
  });

  document.getElementById("resetForm").addEventListener("submit", async event => {
    event.preventDefault();
    if (!client) return showMessage("Connection is not ready.", true);

    const password = document.getElementById("newPassword").value;
    const confirm = document.getElementById("confirmPassword").value;
    if (password.length < 6) return showMessage("Use at least 6 characters.", true);
    if (password !== confirm) return showMessage("Passwords do not match.", true);
    if (!recoveryMode) return showMessage("Recovery session not found. Request a new reset link.", true);

    const { error } = await client.auth.updateUser({ password });
    if (error) return showMessage("Could not update password: " + error.message, true);

    recoveryMode = false;
    history.replaceState(null, "", window.location.pathname);
    showPage("login");
    showMessage("Password updated. You can now log in.");
  });

  client?.auth.onAuthStateChange((event) => {
    if (event === "PASSWORD_RECOVERY") {
      recoveryMode = true;
      showPage("reset");
      showMessage("Enter your new password below.");
    }
  });

  // Handle recovery links that contain a PKCE code.
  (async () => {
    if (!client) return;
    const params = new URLSearchParams(window.location.search);
    if (params.has("code")) {
      const { error } = await client.auth.exchangeCodeForSession(params.get("code"));
      if (error) showMessage("Recovery link error: " + error.message, true);
    }
  })();
})();
</script>
</body>
</html>
